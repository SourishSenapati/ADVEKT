[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advekt"
version = "1.0.0"
description = "ADVEKT: Autonomous Multi-Discipline Chemical & Mechanical Engineering CAE Suite with Native RAEBYES Circuit Breaking"
readme = "README.md"
authors = [
    { name = "Sourish Senapati", email = "engineering@finnoaq.com" }
]
license = { text = "ADVEKT Commercial & IP Protection License v1.0 (Non-Commercial Free / Commercial License Required)" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS"
]
requires-python = ">=3.10"
dependencies = [
    "pywin32>=306; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
advekt = "agentic_chemeng.cli:main"
advekt-mcp = "agentic_chemeng.mcp.server:main"
agentic-chemeng = "agentic_chemeng.cli:main"
solidworks-cli = "agentic_chemeng.solidworks.cli:main"
aspen-plus-cli = "agentic_chemeng.aspen_plus.cli:main"
aspen-hysys-cli = "agentic_chemeng.aspen_hysys.cli:main"
dwsim-cli = "agentic_chemeng.dwsim.cli:main"
chemcad-cli = "agentic_chemeng.chemcad.cli:main"
proii-cli = "agentic_chemeng.proii.cli:main"
cantera-cli = "agentic_chemeng.cantera.cli:main"
unisim-cli = "agentic_chemeng.unisim.cli:main"
gproms-cli = "agentic_chemeng.gproms.cli:main"
comsol-cli = "agentic_chemeng.comsol.cli:main"
ansys-cli = "agentic_chemeng.ansys.cli:main"
raebyes-chemeng-cli = "agentic_chemeng.raebyes.cli:main"
autocad-cli = "agentic_chemeng.autocad.cli:main"
thermo-cli = "agentic_chemeng.thermo.cli:main"
hydraulics-cli = "agentic_chemeng.hydraulics.cli:main"
thermal-cli = "agentic_chemeng.thermal.cli:main"
pv-cli = "agentic_chemeng.pressure_vessel.cli:main"
chemeng-mcp = "agentic_chemeng.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_chemeng*", "advekt*"]

